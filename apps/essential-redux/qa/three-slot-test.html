<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Essential Redux Three-Slot Test</title>
  <style>
    *{box-sizing:border-box}
    html{background:#000}
    body{margin:0;padding:16px;background:linear-gradient(#333,#000);color:#fff;font-family:Arial,sans-serif;min-width:300px;min-height:100vh}
    main{max-width:390px;margin:0 auto}
    h1{font-size:28px;line-height:34px;margin:0 0 8px}
    p{margin:0 0 20px;color:#ddd}
    .card{padding:18px;border:1px solid #555;border-radius:8px;background:#222;box-shadow:0 0 8px rgba(0,0,0,.5)}
    label{display:block;margin:0 0 16px;font-size:17px;font-weight:bold}
    select{display:block;width:100%;height:48px;margin-top:6px;padding:0 12px;border:2px solid #555;border-radius:4px;background:#000;color:#fff;font-size:17px}
    button{width:100%;min-height:52px;margin-top:8px;border:0;border-radius:4px;background:#008cca;color:#fff;font-size:18px;font-weight:bold}
    #status{min-height:24px;margin-top:12px;text-align:center;color:#00ffaa}
    .note{margin-top:16px;font-size:14px;color:#bbb}
  </style>
</head>
<body>
  <main>
    <h1>Three-slot emulator test</h1>
    <p>This lightweight page sends a short response to CloudPebble and enables the middle information slot.</p>
    <div class="card">
      <label>Slot 1
        <select id="leftMetric"></select>
      </label>
      <label>Slot 2
        <select id="middleMetric"></select>
      </label>
      <label>Slot 3
        <select id="rightMetric"></select>
      </label>
      <button id="save" type="button">Load 3-slot layout</button>
      <div id="status" role="status"></div>
      <div class="note">This is an emulator-only test page. It returns only the three layout settings and uses companion defaults for other options.</div>
    </div>
  </main>
  <script>
    (function(){
      var metrics=[
        ['calendar','Calendar'],['weather','Weather'],['battery','Battery'],['calories','Calories'],
        ['activity','Activity time'],['sleep','Sleep time'],['heart','Heart rate'],['steps','Steps'],
        ['distance','Distance'],['none','None']
      ];
      function addOptions(id,selected){
        var select=document.getElementById(id);
        metrics.forEach(function(metric){
          var option=document.createElement('option');
          option.value=metric[0];option.textContent=metric[1];
          select.appendChild(option);
        });
        select.value=selected;
      }
      addOptions('leftMetric','calendar');
      addOptions('middleMetric','steps');
      addOptions('rightMetric','weather');
      document.getElementById('save').onclick=function(){
        var payload={
          leftMetric:document.getElementById('leftMetric').value,
          middleMetric:document.getElementById('middleMetric').value,
          rightMetric:document.getElementById('rightMetric').value,
          showMiddleSlot:true,
          slotCount:3
        };
        var response=encodeURIComponent(JSON.stringify(payload));
        document.getElementById('status').textContent='Loading three-slot layout…';
        document.location='pebblejs://close#'+response;
      };
    }());
  </script>
</body>
</html>
